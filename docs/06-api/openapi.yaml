        '404':
          $ref: '#/components/responses/NotFound'

  /admin/opportunities/{id}/status:
    patch:
      tags:
        - Admin
      summary: Admin opportunity moderation
      description: |
        Moderates and closes inappropriate opportunity postings.
        **Role(s):** `ADMIN` only. (FR-ADM-04)
      operationId: moderateOpportunityAdmin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true

        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # 6. SKILL & DEPARTMENT TAXONOMY APIS
  # ============================================================================
  /skills:
    get:
      tags:
        - Skills Taxonomy
      summary: Search skills master taxonomy
      description: |
        Returns active skills matching search query or category.
        **Role(s):** Any authenticated user. (FR-ADM-03, FR-STU-02, FR-INT-01)
      operationId: listSkills
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Skills list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Skills Taxonomy
      summary: Add skill to taxonomy (Admin)
      description: |
        Adds a new canonical skill to the taxonomy.
        **Role(s):** `ADMIN` only. (FR-ADM-03)
      operationId: createSkill
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSkillRequest'
      responses:
        '201':
          description: Skill created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Skill name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /skills/{id}:
    put:
      tags:
        - Skills Taxonomy
      summary: Update master skill (Admin)
      description: |
        Renames or re-categorizes a skill in the master taxonomy.
        **Role(s):** `ADMIN` only. (FR-ADM-03)
      operationId: updateSkill
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSkillRequest'
      responses:
        '200':
          description: Skill updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Skills Taxonomy
      summary: Soft-deactivate skill (Admin)
      description: |
        Sets `is_active = false`. Existing references are preserved.
        **Role(s):** `ADMIN` only. (FR-ADM-03)
      operationId: deleteSkill
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Skill deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /departments:
    get:
      tags:
        - Departments Taxonomy
      summary: List standardized academic departments
      description: |
        Returns active department master catalog for eligibility and profile selection.
        **Role(s):** Any authenticated user. (DBQ-01)
      operationId: listDepartments
      security:
        - BearerAuth: []
      parameters:
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Departments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Departments Taxonomy
      summary: Create academic department (Admin)
      description: |
        Adds a new department to the master catalog.
        **Role(s):** `ADMIN` only. (DBQ-01)
      operationId: createDepartment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Department name or code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================================
  # 7. OPPORTUNITY APIS
  # ============================================================================
  /opportunities:
    get:
      tags:
        - Opportunities
      summary: Search and browse open opportunities
      description: |
        Returns paginated list of open opportunities with filtering.
        When invoked with a Student token, each item is automatically annotated with
        the student's computed `matchPercent` and `isEligible` flags. (FR-INT-03, FR-MATCH-01, FR-MATCH-02)
        **Role(s):** Any authenticated user.
      operationId: searchOpportunities
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpportunityType'
        - name: mode
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpportunityMode'
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: minCgpa
          in: query
          required: false
          schema:
            type: number
            format: float
        - name: status
          in: query
          required: false
          description: Filter by opportunity status (defaults to OPEN if omitted)
          schema:
            $ref: '#/components/schemas/OpportunityStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: created_at,desc
      responses:
        '200':
          description: Paginated opportunity listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOpportunityListItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Opportunities
      summary: Post a new internship or placement opportunity
      description: |
        Creates an opportunity posting with required skills (minimum 1 required),
        branch eligibility, and criteria.
        **Creation State:** Newly posted opportunities are automatically created with `status: OPEN`.
        **Verification Status Policy:** Any registered company profile may post. The company's
        `verification_status` is displayed on the posting.
        **Role(s):** `COMPANY` (own postings). (FR-INT-01)
      operationId: createOpportunity
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOpportunityRequest'
      responses:
        '201':
          description: Opportunity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDetailDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /opportunities/company/my:
    get:
      tags:
        - Opportunities
      summary: List company's own postings
      description: |
        Returns all postings created by the authenticated company.
        **Role(s):** `COMPANY` (own postings). (FR-INT-01, FR-INT-02)
      operationId: getCompanyOpportunities
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpportunityStatus'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpportunityType'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Company opportunities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOpportunityListItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /opportunities/{id}:
    get:
      tags:
        - Opportunities
      summary: Get opportunity details
      description: |
        Returns full details of an opportunity. For student sessions, provides
        per-opportunity match breakdown (`matchedSkills`, `missingSkills`, `matchPercent`, `isEligible`).
        **Role(s):** Any authenticated user. (FR-INT-03, FR-MATCH-01, FR-MATCH-02)
      operationId: getOpportunityById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detailed opportunity representation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDetailDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Opportunities
      summary: Update opportunity posting
      description: |
        Updates opportunity details.
        **Ownership:** Creator company only (`company_profile_id == auth.companyProfileId`).
        **Role(s):** `COMPANY`. (FR-INT-02)
      operationId: updateOpportunity
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOpportunityRequest'
      responses:
        '200':
          description: Opportunity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDetailDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /opportunities/{id}/status:
    patch:
      tags:
        - Opportunities
      summary: Update opportunity publication status
      description: |
        Allows the posting company to update the opportunity publication status (close an active opportunity or reopen a closed opportunity).
        **Ownership:** Creator company only.
        **Role(s):** `COMPANY`. (FR-INT-02)
      operationId: updateOpportunityStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/OpportunityStatus'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDetailDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # 8. APPLICATION APIS
  # ============================================================================
  /applications:
    post:
      tags:
        - Applications
      summary: Submit application
      description: |
        Student applies to an open opportunity. Validates eligibility and open status.
        Snapshots `matchPercentAtApply`. Rejects duplicates with 409 Conflict.
        **Role(s):** `STUDENT` (eligible students only). (FR-APP-01, FR-MATCH-02)
      operationId: submitApplication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitApplicationRequest'
      responses:
        '201':
          description: Application submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDto'
        '400':
          description: Opportunity closed, deadline passed, or student ineligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate application attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/my:
    get:
      tags:
        - Applications
      summary: Student's submitted applications
      description: |
        Returns all applications submitted by authenticated student with recruitment pipeline status.
        **Role(s):** `STUDENT` (own applications). (FR-APP-02)
      operationId: getMyApplications
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageStudentApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /applications/{id}:
    get:
      tags:
        - Applications
      summary: Get application details
      description: |
        Returns application record.
        **Access Control:** Accessible to applicant student, creator company, student's college, and Admin.
        (FR-APP-02, FR-APP-04)
      operationId: getApplicationById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetailDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /opportunities/{opportunityId}/applications:
    get:
      tags:
        - Applications
      summary: Company view candidates ranked by skill match
      description: |
        Returns applicants to the opportunity, filtered by eligibility and ordered
        descending by `matchPercentAtApply`.
        **Ownership:** Creator company only (`opportunities.company_profile_id == auth.companyProfileId`).
        **Role(s):** `COMPANY`, `ADMIN`. (FR-APP-03)
      operationId: getOpportunityApplications
      security:
        - BearerAuth: []
      parameters:
        - name: opportunityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - name: eligibleOnly
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Ranked applicant list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCompanyApplicantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{id}/status:
    patch:
      tags:
        - Applications
      summary: Advance recruitment pipeline stage
      description: |
        Advances candidate stage (`APPLIED` → `UNDER_REVIEW` → `SHORTLISTED` → `INTERVIEW` → `SELECTED` | `REJECTED`).
        When an application transitions to `SELECTED`, the system automatically creates an associated `internship_records` entity (with matching type and initial `UPCOMING` status) as a single atomic database transaction.
        **Ownership:** Creator company only.
        **Role(s):** `COMPANY`. (FR-APP-04, FR-APP-05, OD-03)
      operationId: updateApplicationStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/ApplicationStatus'
      responses:
        '200':
          description: Stage updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDto'
        '400':
          description: Invalid transition attempt (skipping or reversing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # 9. INTERNSHIP & PLACEMENT APIS
  # ============================================================================
  /internships/my:
    get:
      tags:
        - Internships & Placements

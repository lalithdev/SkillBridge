      operationId: getMyInternships
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Internships list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternshipRecordDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /internships/company/my:
    get:
      tags:
        - Internships & Placements
      summary: Company's active interns & placements
      description: |
        Returns confirmed interns/placements hired by the authenticated company.
        **Role(s):** `COMPANY` (own hires). (FR-INT-04)
      operationId: getCompanyInternships
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InternshipStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Company internships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageInternshipRecordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /internships/{id}:
    get:
      tags:
        - Internships & Placements
      summary: Get internship/placement record
      description: |
        Returns specific internship outcome and status.
        **Access Control:** Accessible to intern student, employer company, student's college, and Admin.
        (FR-INT-04, FR-INT-06)
      operationId: getInternshipById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Internship details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternshipRecordDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /internships/{id}/status:
    patch:
      tags:
        - Internships & Placements
      summary: Update internship progress lifecycle
      description: |
        Updates progress status through `UPCOMING` → `ONGOING` → `COMPLETED`.
        **Ownership:** Employer company only.
        **Role(s):** `COMPANY`. (FR-INT-04)
      operationId: updateInternshipStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/InternshipStatus'
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternshipRecordDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # 10. FEEDBACK APIS
  # ============================================================================
  /internships/{internshipId}/feedback:
    post:
      tags:
        - Feedback
      summary: Submit company feedback
      description: |
        Company provides qualitative free-text feedback following internship completion.
        **Precondition:** Requires `internship_records.status = 'COMPLETED'`.
        **Ownership:** Employer company only.
        **Role(s):** `COMPANY`. (FR-INT-05, OD-04, OD-11, DBQ-04)
      operationId: submitCompanyFeedback
      security:
        - BearerAuth: []
      parameters:
        - name: internshipId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFeedbackRequest'
      responses:
        '201':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackDto'
        '400':
          description: Internship record not yet completed or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Feedback already submitted for this record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Feedback
      summary: View feedback for an internship
      description: |
        Visible to intern student, employer company, and affiliated college placement cell.
        **Role(s):** `STUDENT`, `COMPANY`, `COLLEGE`, `ADMIN`. (FR-INT-05, OD-04)
      operationId: getInternshipFeedback
      security:
        - BearerAuth: []
      parameters:
        - name: internshipId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Feedback details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /colleges/feedback:
    get:
      tags:
        - Feedback
      summary: College aggregated company feedback
      description: |
        Returns qualitative feedback entries across all students affiliated with this college.
        **Data Scoping:** Automatically scoped to caller's `collegeId` extracted from JWT.
        **Role(s):** `COLLEGE` (own students only), `ADMIN`. (FR-INT-05, OD-04)
      operationId: getCollegeAggregatedFeedback
      security:
        - BearerAuth: []
      parameters:
        - name: collegeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Admin-only override
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated feedback list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCollegeFeedbackResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================================
  # 11. MATCHING APIS
  # ============================================================================
  /matching/opportunities/{opportunityId}:
    get:
      tags:
        - Matching
      summary: Dynamic match evaluation for opportunity
      description: |
        Computes matched skills, missing skills, coverage %, and eligibility for the authenticated student.
        **Role(s):** `STUDENT` only. (FR-MATCH-01, FR-MATCH-02)
      operationId: evaluateOpportunityMatch
      security:
        - BearerAuth: []
      parameters:
        - name: opportunityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Skill match result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResultDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /matching/recommendations:
    get:
      tags:
        - Matching
      summary: Recommended opportunities for student
      description: |
        Returns open opportunities ranked by skill match % descending.
        **Role(s):** `STUDENT` only. (FR-STU-06 / S3)
      operationId: getRecommendedOpportunities
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Ranked recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOpportunityListItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================================
  # 12. ANALYTICS APIS
  # ============================================================================
  /analytics/skills/availability:
    get:
      tags:
        - Analytics
      summary: College student skill availability %
      description: |
        Computes percentage of college students possessing each skill.
        **Data Scoping:** Automatically scoped to caller's `collegeId` extracted from JWT.
        **Role(s):** `COLLEGE` (own college), `ADMIN`. (FR-ANL-01)
      operationId: getSkillAvailability
      security:
        - BearerAuth: []
      parameters:
        - name: collegeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Admin-only override
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Skill availability table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillAvailabilityDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /analytics/skills/demand:
    get:
      tags:
        - Analytics
      summary: Industry skill demand %
      description: |
        Computes percentage of open opportunities requiring each skill.
        **Scope:** Aggregated across all `OPEN` opportunities platform-wide (OD-07).
        **Role(s):** `COLLEGE`, `ADMIN`. (FR-ANL-02, FR-ANL-04 / S6)
      operationId: getSkillDemand
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpportunityType'
      responses:
        '200':
          description: Skill demand table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillDemandDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /analytics/skills/gap:
    get:
      tags:
        - Analytics
      summary: College skill gap dashboard
      description: |
        Combines industry demand % and college availability % to compute gap severity
        (`HIGH` >= 30%, `MODERATE` >= 15%, `LOW` > 0%, `SURPLUS` <= 0%).
        **Data Scoping:** College availability scoped to caller's `collegeId` from JWT claim.
        **Role(s):** `COLLEGE` (own college), `ADMIN`. (FR-ANL-03, FR-ANL-05, OD-01)
      operationId: getSkillGapDashboard
      security:
        - BearerAuth: []
      parameters:
        - name: collegeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Admin-only override
        - name: severity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GapSeverity'
      responses:
        '200':
          description: Skill gap analysis dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillGapDashboardDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /analytics/placement-funnel:
    get:
      tags:
        - Analytics
      summary: College recruitment placement funnel
      description: |
        Returns aggregated counts of applications currently residing in each recruitment stage
        (`applied`, `underReview`, `shortlisted`, `interview`, `selected`, `rejected`) across all
        students affiliated with the college.
        **Data Scoping:** Automatically scoped to caller's `collegeId` extracted from JWT.
        **Role(s):** `COLLEGE` (own students only), `ADMIN`. (FR-COL-02)
      operationId: getPlacementFunnel
      security:
        - BearerAuth: []
      parameters:
        - name: collegeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Admin-only override
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Placement funnel statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementFunnelDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# ==============================================================================
# COMPONENTS (SCHEMAS, PARAMETERS, RESPONSES, SECURITY)
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Stateless JWT Bearer token passed in the `Authorization: Bearer <token>` header.

        Note on Architectural Separation:
        In OpenAPI 3.0, the BearerAuth security scheme represents HTTP transport-level
        authentication (verifying a valid, unexpired token signature). Fine-grained
        role-based access control (STUDENT, COMPANY, COLLEGE, ADMIN) and resource
        ownership/institutional data scoping rules are enforced server-side by
        Spring Security URL filters and @PreAuthorize method security.

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-based page index
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Number of items per page

  responses:
    Unauthorized:
      description: Authentication missing, expired, or invalid JWT signature
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user does not possess required role or resource ownership
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Targeted entity ID does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request payload failed schema or bean validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --- Enums ---
    UserRole:
      type: string
      enum: [STUDENT, COMPANY, COLLEGE, ADMIN]
      description: System-wide user roles

    RegisterRole:
      type: string
      enum: [STUDENT, COMPANY, COLLEGE]
      description: Allowed self-registration roles (ADMIN excluded from public registration)

    VerificationStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED]

    OpportunityType:
      type: string
      enum: [INTERNSHIP, PLACEMENT]

    OpportunityMode:
      type: string
      enum: [ONSITE, REMOTE, HYBRID]

    OpportunityStatus:
      type: string
      enum: [OPEN, CLOSED]
      description: Publication status of an opportunity (new postings are created as OPEN; can be toggled between OPEN and CLOSED)

    ApplicationStatus:
      type: string
      enum: [APPLIED, UNDER_REVIEW, SHORTLISTED, INTERVIEW, SELECTED, REJECTED]

    InternshipStatus:
      type: string
      enum: [UPCOMING, ONGOING, COMPLETED]

    GapSeverity:
      type: string
      enum: [HIGH, MODERATE, LOW, SURPLUS]

    # --- Common Error Schemas ---
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: cgpa
        message:
          type: string
          example: must be between 0.0 and 10.0

    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-08-27T15:30:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        path:
          type: string
          example: /api/v1/students/profile

    # --- Auth Schemas ---
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - role
        - name
      properties:
        email:
          type: string
          format: email
          example: student@college.edu
        password:
          type: string
          minLength: 8
          example: Password@123
        role:
          $ref: '#/components/schemas/RegisterRole'
        name:
          type: string
          description: Display name (Company/College name, or Student Full Name)
          example: John Doe
        collegeId:
          type: integer
          format: int64
          description: Required when role is STUDENT
          example: 1
        departmentId:
          type: integer
          format: int64
          description: Optional initial branch when role is STUDENT
          example: 1

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@skillbridge.org
        password:
          type: string
          example: Password@123

    AuthResponse:
      type: object
      required:
        - token
        - role
        - userId
      properties:
        token:
          type: string
          description: Stateless Bearer JWT token (valid for 24h)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        role:
          $ref: '#/components/schemas/UserRole'
        userId:
          type: integer
          format: int64
        studentProfileId:
          type: integer
          format: int64
        companyProfileId:
          type: integer
          format: int64
        collegeId:
          type: integer
          format: int64

    CurrentUserResponse:
      type: object
      required:
        - userId
        - email
        - role
        - isActive
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
        studentProfileId:
          type: integer
          format: int64
        companyProfileId:
          type: integer
          format: int64
        collegeId:
          type: integer
          format: int64

    # --- Student Schemas ---
    StudentProfileResponse:
      type: object
      required:
        - id
        - userId
        - collegeId
        - firstName
        - lastName
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        collegeId:
          type: integer
          format: int64
        collegeName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        departmentId:
          type: integer
          format: int64
        departmentName:
          type: string
        departmentCode:
          type: string
        yearOfStudy:
          type: integer
          example: 3
        cgpa:
          type: number
          format: float
          example: 8.75
        careerInterests:
          type: string
        portfolioUrl:
          type: string
        githubUrl:
          type: string
        resumePath:
          type: string
        hasResume:
          type: boolean
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillDto'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDto'
        certifications:
          type: array
          items:
            $ref: '#/components/schemas/CertificationDto'

    UpdateStudentProfileRequest:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        departmentId:
          type: integer
          format: int64
          example: 1
        yearOfStudy:
          type: integer
          minimum: 1
          maximum: 8
          example: 3
        cgpa:
          type: number
          format: float
          minimum: 0.0
          maximum: 10.0
          example: 8.5
        careerInterests:
          type: string
          example: Full Stack Web Development and Cloud Architecture
        portfolioUrl:
          type: string
          format: uri
        githubUrl:
          type: string
          format: uri

    AddStudentSkillRequest:
      type: object
      required:
        - skillId
      properties:
        skillId:
          type: integer
          format: int64

    ProjectDto:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        projectUrl:
          type: string

    ProjectRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: Smart Attendance System
        description:
          type: string
          example: Real-time face recognition attendance portal built with React and OpenCV
        projectUrl:
          type: string
          format: uri
          example: https://github.com/example/attendance

    CertificationDto:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        issuer:
          type: string
        issuedDate:
          type: string
          format: date
        certificateUrl:
          type: string

    CertificationRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: AWS Certified Solutions Architect - Associate
        issuer:
          type: string
          example: Amazon Web Services
        issuedDate:
          type: string
          format: date
          example: "2025-11-15"
        certificateUrl:
          type: string
          format: uri

    ResumeUploadResponse:
      type: object
      required:
        - resumePath
        - fileName
      properties:
        resumePath:
          type: string
        fileName:
          type: string

    # --- Company & College Schemas ---
    CompanyProfileDto:
      type: object
      required:
        - id
        - userId
        - name
        - verificationStatus
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        name:
          type: string
        industry:
          type: string
        description:
          type: string
        location:
          type: string
        website:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'

    UpdateCompanyProfileRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        industry:
          type: string
        description:
          type: string
        location:
          type: string
        website:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string

    CollegeProfileDto:
      type: object
      required:
        - id
        - userId
        - name
        - verificationStatus
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        website:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'

    UpdateCollegeProfileRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        address:
          type: string
        website:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string

    CollegeDepartmentSummaryDto:
      type: object
      required:
        - departmentId
        - departmentName
        - departmentCode
        - studentCount
      properties:
        departmentId:
          type: integer
          format: int64
        departmentName:
          type: string
        departmentCode:
          type: string
        studentCount:
          type: integer

    StudentSummaryDto:
      type: object
      required:
        - id
        - firstName
        - lastName
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        departmentName:
          type: string
        yearOfStudy:
          type: integer
        cgpa:
          type: number
          format: float
        skillCount:
          type: integer

    # --- Taxonomy Schemas ---
    SkillDto:
      type: object
      required:
        - id
        - name
        - isActive
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Spring Boot
        category:
          type: string
          example: Framework
        isActive:
          type: boolean

    CreateSkillRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Docker
        category:
          type: string
          example: DevOps

    UpdateSkillRequest:
      type: object
      required:
        - name
        - isActive
      properties:
        name:
          type: string
        category:
          type: string
        isActive:
          type: boolean

    DepartmentDto:
      type: object
      required:
        - id
        - name
        - code
        - isActive
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Computer Science and Engineering
        code:
          type: string
          example: CSE
        isActive:
          type: boolean

    CreateDepartmentRequest:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          example: Information Technology
        code:
          type: string
          example: IT

    # --- Opportunity Schemas ---
    CreateOpportunityRequest:
      type: object
      required:
        - title
        - type
        - requiredSkillIds
      properties:
        title:
          type: string
          example: Junior Backend Developer Intern
        description:
          type: string
        type:
          $ref: '#/components/schemas/OpportunityType'
        location:
          type: string
        mode:
          $ref: '#/components/schemas/OpportunityMode'
        durationWeeks:
          type: integer
          example: 12
        stipendAmount:
          type: number
          format: float
          example: 25000.00
        stipendCurrency:
          type: string
          default: INR
        minCgpa:
          type: number
          format: float
          example: 7.5
        applicationDeadline:
          type: string

openapi: 3.0.3
info:
  title: SkillBridge REST API
  description: |
    Official OpenAPI 3.0.3 specification for SkillBridge — Academia–Industry Skill Intelligence & Career Collaboration Platform (SIH26044).
    Derived strictly from approved PRD, SRS, Technical Architecture, and Database Design documents.

    ### Note on Architectural Separation of Concerns:
    In this OpenAPI 3.0 specification, the `BearerAuth` security scheme represents HTTP transport-level **authentication** (verifying a valid, signed, unexpired JWT token).
    Specific **role permissions** (`STUDENT`, `COMPANY`, `COLLEGE`, `ADMIN`), **resource ownership rules** (e.g. company opportunity editing), and **institutional data scoping** (e.g. college analytics derived from token context) are enforced server-side by Spring Security URL security (`SecurityConfig`) and method security (`@PreAuthorize` + `SecurityService`).
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: SkillBridge Engineering Team
servers:
  - url: /api/v1
    description: Production & Local API Gateway Base Path

tags:
  - name: Authentication
    description: User registration, login, session inspection, and token handling
  - name: Students
    description: Student profile, current skills, portfolio items, and resume management
  - name: Companies
    description: Company profile and organization management
  - name: Colleges
    description: College profile, student roster, and placement oversight
  - name: Admin
    description: Platform administration, user moderation, and organization verification
  - name: Skills Taxonomy
    description: Master skills catalog management
  - name: Departments Taxonomy
    description: Standardized academic engineering branches and departments catalog
  - name: Opportunities
    description: Internship and placement opportunity postings and discovery
  - name: Applications
    description: Student applications and company recruitment pipeline progression
  - name: Internships & Placements
    description: Confirmed internship and placement outcome tracking
  - name: Feedback
    description: Company post-internship feedback collection and viewing
  - name: Matching
    description: Skill coverage calculation, eligibility evaluation, and recommendations
  - name: Analytics
    description: College skill availability, industry demand, skill gap analysis, and recruitment funnel

paths:
  # ============================================================================
  # 1. AUTHENTICATION APIS
  # ============================================================================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user account
      description: |
        Registers a new account under exactly one role (`STUDENT`, `COMPANY`, or `COLLEGE`).
        Creates the base `users` record and initializes the corresponding role profile.
        **Note:** Admin accounts cannot be self-registered via this public endpoint.
        (FR-AUTH-01)
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User authentication
      description: |
        Validates user credentials and returns a signed stateless JWT token with role claims.
        (FR-AUTH-02)
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid email or password, or account deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current authenticated user context
      description: |
        Returns identity, role, and profile identifiers extracted from token context.
        **Role(s):** Any authenticated user (`STUDENT`, `COMPANY`, `COLLEGE`, `ADMIN`).
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: |
        Stateless JWT logout acknowledgement.
        **Note:** Because JWT is stateless and no server-side blacklist is maintained,
        the server acknowledges the request while the client must discard the token
        from client-side memory/sessionStorage. (FR-AUTH-03)
        **Role(s):** Any authenticated user.
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Logged out successfully (token discarded on client)
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # 2. STUDENT APIS
  # ============================================================================
  /students/profile:
    get:
      tags:
        - Students
      summary: Get student profile
      description: |
        Returns the authenticated student's personal, academic, and portfolio details.
        **Role(s):** `STUDENT` (own profile only). (FR-STU-01)
      operationId: getStudentProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Student profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Students
      summary: Update student profile
      description: |
        Updates academic details, department, CGPA, career interests, and portfolio URLs.
        **Role(s):** `STUDENT` (own profile only). (FR-STU-01)
      operationId: updateStudentProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileRequest'
      responses:
        '200':
          description: Student profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /students/{id}/profile:
    get:
      tags:
        - Students
      summary: View specific student profile
      description: |
        Permits reviewing companies (if student applied to company's opportunity),
        the student's affiliated college, or Admin to inspect profile details.
        **Role(s):** `COLLEGE` (affiliated student), `COMPANY` (applied candidate), `ADMIN`.
        (FR-COL-01, FR-APP-03)
      operationId: getStudentProfileById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Student profile ID
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/profile/skills:
    get:
      tags:
        - Students
      summary: List student's current skills
      description: |
        Returns the active skill list of the authenticated student.
        **Role(s):** `STUDENT` (own profile). (FR-STU-02)
      operationId: getStudentSkills
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Skills list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Students
      summary: Add skill to student profile
      description: |
        Adds a skill from master taxonomy to student profile. Rejects duplicates.
        **Role(s):** `STUDENT` (own profile). (FR-STU-02)
      operationId: addStudentSkill
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddStudentSkillRequest'
      responses:
        '201':
          description: Skill added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Skill already present on profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /students/profile/skills/{skillId}:
    delete:
      tags:
        - Students
      summary: Remove skill from student profile
      description: |
        Removes an existing skill from the student profile.
        **Role(s):** `STUDENT` (own profile). (FR-STU-02)
      operationId: removeStudentSkill
      security:
        - BearerAuth: []
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Skill removed successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/profile/projects:
    get:
      tags:
        - Students
      summary: List student portfolio projects
      description: |
        Returns all portfolio projects for authenticated student.
        **Role(s):** `STUDENT` (own profile). (FR-STU-03)
      operationId: getStudentProjects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Projects list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Students
      summary: Add project to portfolio
      description: |
        Creates a new portfolio project entry.
        **Role(s):** `STUDENT` (own profile). (FR-STU-03)
      operationId: createStudentProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /students/profile/projects/{projectId}:
    put:
      tags:
        - Students
      summary: Update portfolio project
      description: |
        Updates an existing portfolio project.
        **Role(s):** `STUDENT` (own project). (FR-STU-03)
      operationId: updateStudentProject
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Students
      summary: Delete portfolio project
      description: |
        Removes a project from portfolio.
        **Role(s):** `STUDENT` (own project). (FR-STU-03)
      operationId: deleteStudentProject
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Project deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/profile/certifications:
    get:
      tags:
        - Students
      summary: List student certifications
      description: |
        Returns all certifications for authenticated student.
        **Role(s):** `STUDENT` (own profile). (FR-STU-03)
      operationId: getStudentCertifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Certifications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificationDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Students
      summary: Add certification
      description: |
        Adds a certification to the student profile.
        **Role(s):** `STUDENT` (own profile). (FR-STU-03)
      operationId: createStudentCertification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationRequest'
      responses:
        '201':
          description: Certification added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /students/profile/certifications/{certificationId}:
    put:
      tags:
        - Students
      summary: Update certification
      description: |
        Updates certification entry.
        **Role(s):** `STUDENT` (own certification). (FR-STU-03)
      operationId: updateStudentCertification
      security:
        - BearerAuth: []
      parameters:
        - name: certificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationRequest'
      responses:
        '200':
          description: Certification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Students
      summary: Delete certification
      description: |
        Deletes certification entry.
        **Role(s):** `STUDENT` (own certification). (FR-STU-03)
      operationId: deleteStudentCertification
      security:
        - BearerAuth: []
      parameters:
        - name: certificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Certification deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/profile/resume:
    post:
      tags:
        - Students
      summary: Upload student resume
      description: |
        Uploads a resume file (PDF or DOCX, max 5 MB). Stored securely on filesystem;
        path saved to `student_profiles.resume_path`.
        **Role(s):** `STUDENT` (own profile). (FR-STU-04 / S1, OD-08)
      operationId: uploadResume
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Resume document (PDF or DOCX only, max 5MB)
      responses:
        '200':
          description: Resume uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeUploadResponse'
        '400':
          description: Invalid file payload or missing file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Resume file exceeds 5 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported file format (only PDF and DOCX permitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Students
      summary: Remove student resume
      description: |
        Deletes existing resume file.
        **Role(s):** `STUDENT` (own profile). (FR-STU-04 / S1)
      operationId: deleteResume
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Resume removed successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/resume:
    get:
      tags:
        - Students
      summary: Download student resume
      description: |
        Streams resume binary.
        **Role(s):** `STUDENT` (own resume), `COMPANY` (applied candidate review), `ADMIN`.
        (FR-STU-04)
      operationId: downloadResume
      security:
        - BearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Resume file stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # 3. COMPANY APIS
  # ============================================================================
  /companies/profile:
    get:
      tags:
        - Companies
      summary: Get company profile
      description: |
        Returns company profile for authenticated company user.
        **Role(s):** `COMPANY` (own profile). (FR-COM-01)
      operationId: getCompanyProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags:
        - Companies
      summary: Update company profile
      description: |
        Updates company details and contact information.
        **Role(s):** `COMPANY` (own profile). (FR-COM-01)
      operationId: updateCompanyProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /companies/{id}:
    get:
      tags:
        - Companies
      summary: View public company profile
      description: |
        Returns company profile including public verification status.
        **Role(s):** Any authenticated user. (FR-COM-01, FR-COM-02)
      operationId: getCompanyById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # 4. COLLEGE APIS
  # ============================================================================
  /colleges/profile:
    get:
      tags:
        - Colleges
      summary: Get college profile
      description: |
        Returns profile for authenticated college.
        **Role(s):** `COLLEGE` (own profile). (FR-COL-01)
      operationId: getCollegeProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: College profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeProfileDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags:
        - Colleges
      summary: Update college profile
      description: |
        Updates college contact info and campus address.
        **Role(s):** `COLLEGE` (own profile). (FR-COL-01)
      operationId: updateCollegeProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollegeProfileRequest'
      responses:
        '200':
          description: College profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeProfileDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /colleges/students:
    get:
      tags:
        - Colleges
      summary: List college students roster
      description: |
        Returns paginated roster of students enrolled in the college.
        **Data Scoping:** Automatically scoped to the caller's `collegeId` extracted from JWT.
        (ADMIN can optionally pass `collegeId` query parameter).
        Supports filtering by department, year of study, and search.
        **Role(s):** `COLLEGE` (own students only), `ADMIN`. (FR-COL-01)
      operationId: getCollegeStudents
      security:
        - BearerAuth: []
      parameters:
        - name: collegeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Admin-only override to view a specific college's roster
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: yearOfStudy
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated student list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageStudentSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /colleges/departments:
    get:
      tags:
        - Colleges
      summary: College department breakdown
      description: |
        Returns student enrollment counts per department for this college.
        **Data Scoping:** Automatically scoped to caller's `collegeId` from JWT claim.
        **Role(s):** `COLLEGE` (own college), `ADMIN`. (FR-COL-01, DBQ-01)
      operationId: getCollegeDepartmentBreakdown
      security:
        - BearerAuth: []
      parameters:
        - name: collegeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Admin-only override
      responses:
        '200':
          description: Department student counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollegeDepartmentSummaryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================================
  # 5. ADMIN APIS
  # ============================================================================
  /admin/users:
    get:
      tags:
        - Admin
      summary: List all user accounts
      description: |
        Paginated platform user list filterable by role and active status.

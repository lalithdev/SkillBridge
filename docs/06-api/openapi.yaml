        **Role(s):** `ADMIN` only. (FR-ADM-02, OD-06)
      operationId: updateVerificationStatusAdmin
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [COLLEGE, COMPANY]
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: College ID or Company ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:

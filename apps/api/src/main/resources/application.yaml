spring:
  application:
    name: skillbridge-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillbridge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}